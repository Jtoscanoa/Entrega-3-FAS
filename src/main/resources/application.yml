spring:
  application:
    name: apuntado-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apuntado}}
    username: ${DB_USER:apuntado}
    password: ${DB_PASSWORD:apuntado}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    auditoria: INFO
apuntado:
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173,http://localhost:8080}
  jwt:
    # Solo para desarrollo local. En produccion JWT_SECRET llega por .env (>= 32 bytes).
    secreto: ${JWT_SECRET:solo-desarrollo-local-cambiar-en-produccion-32b}
