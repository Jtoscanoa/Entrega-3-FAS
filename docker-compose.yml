# Ejecucion local en un comando: docker compose up --build  ->  http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: apuntado
      POSTGRES_USER: apuntado
      POSTGRES_PASSWORD: apuntado
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apuntado"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/apuntado
      DB_USER: apuntado
      DB_PASSWORD: apuntado
      JWT_SECRET: ${JWT_SECRET:-solo-desarrollo-local-cambiar-en-produccion-32b}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:8080,http://localhost:5173}
    ports: ["8080:8080"]
