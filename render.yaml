# Blueprint de Render (ADR-09): un servicio web Docker + PostgreSQL gestionado.
# En Render: New > Blueprint > elegir este repositorio.
databases:
  - name: mesa101-db
    databaseName: apuntado
    user: apuntado
    plan: free

services:
  - type: web
    name: mesa101
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: false   # se despliega desde el pipeline solo con las fitness functions en verde
    envVars:
      - key: DB_HOST
        fromDatabase: { name: mesa101-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: mesa101-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: mesa101-db, property: database }
      - key: DB_USER
        fromDatabase: { name: mesa101-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: mesa101-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGENES
        value: https://*.onrender.com
